name: Thesis archive source audit
on:
  push:
    paths:
      - 'analysis/source_audit/**'
      - '.github/workflows/source-audit-ci.yml'
  pull_request:
    paths:
      - 'analysis/source_audit/**'
      - '.github/workflows/source-audit-ci.yml'
  workflow_dispatch:
jobs:
  archive-inventory-synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install workbook parser
        run: python -m pip install 'openpyxl>=3.1,<4'
      - name: Run archive-audit unit tests
        run: python -m unittest discover -s analysis/source_audit/tests -p "test_*.py" -v
